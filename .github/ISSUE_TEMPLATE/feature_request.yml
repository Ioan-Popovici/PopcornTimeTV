name: Feature request
description: Suggest an enhancement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the user-facing pain point. Skip if it's a polish item.

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: How should it work? Mock-ups, screenshots and links welcome.
    validations:
      required: true

  - type: dropdown
    id: platforms
    attributes:
      label: Platforms affected
      multiple: true
      options:
        - tvOS
        - iOS / iPadOS
        - macOS
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
