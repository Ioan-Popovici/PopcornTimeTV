name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: '0 0 1 * *' # 00:00 on the 1st of every month

# Cancel superseded runs on the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Opt JS actions (checkout, cache, upload-artifact) into Node 24 ahead of GitHub's June 2026 default.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: tvOS
            scheme: PopcornTime (tvOS)
            sdk: appletvos
            destination: generic/platform=tvOS
            app_path: PopcornTime (tvOS).app
            artifact: PopcornTime-tvOS
            artifact_ext: ipa
            vlc_arg: tv
            extra: ""
          - platform: iOS
            scheme: PopcornTime (iOS)
            sdk: iphoneos
            destination: generic/platform=iOS
            app_path: PopcornTime.app
            artifact: PopcornTime-iOS
            artifact_ext: ipa
            vlc_arg: ios
            extra: ""
          - platform: macOS
            scheme: PopcornTime (macOS)
            sdk: macosx
            destination: platform=macOS
            app_path: PopcornTime.app
            artifact: PopcornTime-macOS
            artifact_ext: zip
            vlc_arg: mac
            extra: 'VALID_ARCHS="arm64 x86_64"'

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Install xcbeautify
        run: brew list xcbeautify >/dev/null 2>&1 || brew install xcbeautify

      - name: Cache VLCKit
        uses: actions/cache@v4
        with:
          path: VLCKit
          key: vlckit-${{ matrix.vlc_arg }}-${{ hashFiles('VLCKit/get-vlc-frameworks.sh') }}

      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/PopcornTime*/SourcePackages
          key: ${{ runner.os }}-spm-${{ hashFiles('PopcornTime.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-

      - name: Cache ldid
        if: matrix.artifact_ext == 'ipa'
        uses: actions/cache@v4
        with:
          path: ldid-osx
          key: ldid-osx-v2.1.4-16.g5b8581c

      - name: Fetch VLCKit
        run: bash VLCKit/get-vlc-frameworks.sh ${{ matrix.vlc_arg }}

      - name: Build
        run: |
          set -o pipefail
          xcodebuild archive \
            -project PopcornTime.xcodeproj \
            -scheme "${{ matrix.scheme }}" \
            -destination "${{ matrix.destination }}" \
            -configuration Release \
            -archivePath build/PopcornTime.xcarchive \
            CODE_SIGN_IDENTITY= \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ${{ matrix.extra }} | xcbeautify --renderer github-actions

      - name: Package (.ipa)
        if: matrix.artifact_ext == 'ipa'
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R "build/PopcornTime.xcarchive/Products/Applications/${{ matrix.app_path }}" Payload/
          if [ ! -f ldid-osx ]; then
            curl -fsSL --retry 3 \
              https://github.com/sbingner/ldid/releases/download/v2.1.4+16.g5b8581c/ldid-osx.gz \
              | gunzip -c > ldid-osx
            chmod +x ldid-osx
          fi
          BIN_NAME=$(basename "${{ matrix.app_path }}" .app)
          ./ldid-osx -S "Payload/${{ matrix.app_path }}/${BIN_NAME}"
          zip -qr "${{ matrix.artifact }}.ipa" Payload

      - name: Package (.zip)
        if: matrix.artifact_ext == 'zip'
        run: |
          set -euo pipefail
          mkdir -p Payload
          cp -R build/PopcornTime.xcarchive/Products/Applications/. Payload/
          zip -qr "${{ matrix.artifact }}.zip" Payload

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.${{ matrix.artifact_ext }}

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}.${{ matrix.artifact_ext }}
